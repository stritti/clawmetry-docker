version: 2
updates:
  # Keep GitHub Actions up to date, grouped by publisher/purpose
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels:
      - dependencies
    open-pull-requests-limit: 5
    groups:
      actions-official:
        patterns:
          - "actions/*"
      docker-actions:
        patterns:
          - "docker/*"
      security-actions:
        patterns:
          - "aquasecurity/*"
          - "github/codeql-action"

  # Keep Docker images up to date: base image (Dockerfile) separate from compose services
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    labels:
      - dependencies
    open-pull-requests-limit: 3
    groups:
      docker-base-image:
        patterns:
          - "python"
      compose-service-images:
        patterns:
          - "*"
        exclude-patterns:
          - "python"

  # Keep docs npm dependencies up to date: direct dependency separate from transitive ones
  - package-ecosystem: npm
    directory: /docs
    schedule:
      interval: weekly
    labels:
      - dependencies
    open-pull-requests-limit: 3
    groups:
      docs-direct:
        patterns:
          - "vitepress"
      docs-transitive:
        patterns:
          - "*"
        exclude-patterns:
          - "vitepress"
