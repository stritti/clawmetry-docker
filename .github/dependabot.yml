version: 2
updates:
  # Keep GitHub Actions up to date — all action bumps grouped into one PR
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels:
      - dependencies
    open-pull-requests-limit: 3
    groups:
      actions:
        patterns:
          - "*"

  # Keep Docker base images up to date
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    labels:
      - dependencies
    open-pull-requests-limit: 2

  # Keep VitePress and other npm dependencies up to date — grouped into one PR
  - package-ecosystem: npm
    directory: /docs
    schedule:
      interval: weekly
    labels:
      - dependencies
    open-pull-requests-limit: 3
    groups:
      docs-dependencies:
        patterns:
          - "*"
