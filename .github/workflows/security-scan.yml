name: Security Scan

on:
  push:
    branches:
      - main
    paths:
      - 'Dockerfile'
      - '.github/workflows/security-scan.yml'
  pull_request:
    paths:
      - 'Dockerfile'
      - '.github/workflows/security-scan.yml'
  schedule:
    # Run weekly on Mondays at 07:00 UTC
    - cron: '0 7 * * 1'
  workflow_dispatch:

# Least-privilege default; the job below adds security-events: write for SARIF upload.
permissions:
  contents: read

jobs:
  trivy-scan:
    name: Trivy CVE Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Get clawmetry version from PyPI
        id: pypi
        run: |
          VERSION=$(curl -sf https://pypi.org/pypi/clawmetry/json | python3 -c "import sys, json; print(json.load(sys.stdin)['info']['version'])")
          if [ -z "$VERSION" ]; then
            echo "Failed to fetch clawmetry version from PyPI" >&2
            exit 1
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Build Docker image for scanning
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: clawmetry:scan
          cache-from: type=gha
          cache-to: type=gha
          build-args: |
            CLAWMETRY_VERSION=${{ steps.pypi.outputs.version }}

      - name: Run Trivy vulnerability scan on Docker image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: clawmetry:scan
          format: sarif
          output: trivy-image-results.sarif
          severity: CRITICAL,HIGH
          exit-code: '0'

      - name: Upload Trivy image scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy-image-results.sarif
          category: trivy-image

      - name: Run Trivy vulnerability scan on Dockerfile (misconfiguration)
        if: always()
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: Dockerfile
          format: sarif
          output: trivy-config-results.sarif
          exit-code: '0'

      - name: Upload Trivy config scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy-config-results.sarif
          category: trivy-config
